<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>ppippi_zip 링크 모음</title>
<style>
:root{
  --bg:#faf9f6; --card:#fff; --line:#e5e2dc; --text:#18181b; --muted:#5b5b63; --accent:#b8472a; --chip:#f4e9e4;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#18181b; --card:#26262b; --line:#3a3a41; --text:#faf9f6; --muted:#b8b8bf; --accent:#f2a27f; --chip:#3a2d28; }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.5;word-break:keep-all;
  padding:max(28px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
.wrap{max-width:480px;margin:0 auto}
header{text-align:center;padding:8px 0 28px}
.avatar{
  width:84px;height:84px;border-radius:50%;margin:0 auto 14px;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:700;letter-spacing:-.02em;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.bio{margin-top:6px;font-size:15px;color:var(--muted)}
ul{list-style:none;display:flex;flex-direction:column;gap:12px}
a.btn{
  display:flex;align-items:center;gap:12px;min-height:64px;padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  color:inherit;text-decoration:none;transition:transform .12s ease,border-color .12s ease;
}
a.btn:hover{border-color:var(--accent)}
a.btn:active{transform:scale(.985)}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.txt{flex:1;min-width:0}
.cat{
  display:inline-block;margin-bottom:4px;padding:1px 9px;border-radius:999px;
  background:var(--chip);color:var(--accent);font-size:12px;font-weight:700;
}
.ttl{font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.sub{display:block;margin-top:2px;font-size:13.5px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;margin:0 -16px 16px;padding:2px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs[hidden]{display:none}
.tab{
  flex:none;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.arrow{flex:none;font-size:20px;color:var(--muted)}
.state{text-align:center;color:var(--muted);font-size:15px;padding:36px 8px}
.notice{margin:-6px 0 20px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13.5px;line-height:1.5;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar"><img src="profile.png" alt="ppippi_zip 프로필 사진" width="84" height="84" decoding="async" onerror="this.parentNode.setAttribute('aria-hidden','true');this.parentNode.textContent='P'"></div>
    <h1>@ppippi_zip</h1>
    <p class="bio">여행·절세·금융 정보를 정리해요</p>
  </header>

  <p class="notice" role="note">※ 이 포스팅은 제휴마케팅이 포함된 광고로 커미션을 지급 받습니다.</p>

  <main>
    <div id="tabs" class="tabs" role="tablist" aria-label="카테고리" hidden></div>
    <ul id="list" aria-live="polite"></ul>
    <p id="state" class="state">링크를 불러오는 중이에요</p>
  </main>

</div>

<script>
(function () {
  var list = document.getElementById('list');
  var state = document.getElementById('state');

  function safeUrl(u) { // http(s)만 허용(javascript: 등 차단)
    try { var x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; }
    catch (e) { return null; }
  }
  var tabs = document.getElementById('tabs');
  var items = [];
  var current = '전체';

  function sorted(arr) { // 최신순(created_at 내림차순). 같은 날짜는 배열 순서(앞이 최신)를 유지한다.
    return arr.map(function (it, i) { return { it: it, i: i }; })
      .sort(function (a, b) {
        var da = String(a.it.created_at || ''), db = String(b.it.created_at || '');
        return da === db ? a.i - b.i : (da < db ? 1 : -1);
      }).map(function (x) { return x.it; });
  }
  function build(it) {
    var href = it && safeUrl(it.url);
    if (!href || !it.title) return null;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer sponsored nofollow';
    var box = document.createElement('div'); box.className = 'txt';
    if (it.category) { var c = document.createElement('span'); c.className = 'cat'; c.textContent = it.category; box.appendChild(c); box.appendChild(document.createElement('br')); }
    var t = document.createElement('span'); t.className = 'ttl'; t.textContent = it.title; box.appendChild(t);
    if (it.cta) { var s = document.createElement('span'); s.className = 'sub'; s.textContent = it.cta; box.appendChild(s); }
    var ar = document.createElement('span'); ar.className = 'arrow'; ar.setAttribute('aria-hidden', 'true'); ar.textContent = '›';
    a.appendChild(box); a.appendChild(ar); li.appendChild(a);
    return li;
  }
  function show() {
    list.textContent = '';
    var n = 0;
    items.forEach(function (it) {
      if (current !== '전체' && it.category !== current) return;
      var li = build(it); if (li) { list.appendChild(li); n++; }
    });
    state.hidden = n > 0;
    if (!n) state.textContent = '곧 새 링크가 올라와요';
  }
  function buildTabs() {
    var cats = [];
    items.forEach(function (it) { if (it && it.category && cats.indexOf(it.category) < 0) cats.push(it.category); });
    tabs.textContent = '';
    if (!cats.length) { tabs.hidden = true; return; }
    ['전체'].concat(cats).forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = name;
      b.setAttribute('aria-selected', name === current ? 'true' : 'false');
      b.addEventListener('click', function () {
        current = name;
        Array.prototype.forEach.call(tabs.children, function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
        show();
      });
      tabs.appendChild(b);
    });
    tabs.hidden = false;
  }
  function render(data) {
    items = sorted(data.filter(function (it) { return it && safeUrl(it.url) && it.title; }));
    buildTabs();
    show();
  }

  fetch('links.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { render(Array.isArray(data) ? data : []); })
    .catch(function () { state.hidden = false; state.textContent = '링크를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요'; });
})();
</script>
</body>
</html>
